name: jammate
description: JamMate - a mobile app that helps musicians find nearby musicians and organise jam sessions.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1   # SQLite database
  crypto: ^3.0.3      # password hashing (SHA-256)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
